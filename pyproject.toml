[project]
name = "crewai_job_description_analyzer"
version = "0.1.0"
description = "AI-powered job description and resume matching system built with CrewAI"
authors = [{ name = "Rajat Singh" }]
requires-python = ">=3.10,<3.14"

dependencies = [
    "crewai[google-genai,tools]==1.14.4",
    "gradio==6.24.0",
    "python-docx>=1.2.0",
    "pymupdf==1.26.7",
]

[project.scripts]
crewai_job_description_analyzer = "crewai_job_description_analyzer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]